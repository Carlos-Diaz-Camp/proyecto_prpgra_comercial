services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: criterio
      POSTGRES_USER: criterio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally before running compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - criterio_data:/var/lib/postgresql/data
      - ./database/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
volumes:
  criterio_data:
